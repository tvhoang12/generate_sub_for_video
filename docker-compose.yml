services:
  substudio:
    build:
      context: .
    image: substudio:latest
    container_name: substudio
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
      MODELS_DIR: /models
    volumes:
      - ./data:/data
      - ./models:/models
      - ./backend/app:/app/backend/app
      - ./web/dist:/app/web/dist
      - ./uploads:/app/uploads
      - /var/www/hls:/var/www/hls
      - /var/www/hls/substudio/jobs:/data/jobs
      # TEST_MODE: file SRT nằm cạnh .env trên host → /app/<tên file> trong container
      - "./${TEST_SUBTITLE_FILE:-EP1 (Reborn with rival).my.srt}:/app/${TEST_SUBTITLE_FILE:-EP1 (Reborn with rival).my.srt}:ro"
