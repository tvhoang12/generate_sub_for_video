services:
  substudio:
    build:
      context: .
    image: substudio:latest
    container_name: substudio
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
      MODELS_DIR: /models
    volumes:
      - ./data:/data
      - ./models:/models
      - ./backend/app:/app/backend/app
      - /var/www/hls/substudio/jobs:/data/jobs
