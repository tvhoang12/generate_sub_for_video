services:
  substudio:
    build:
      context: .
      args:
        WHISPER_NATIVE: "ON"
    image: substudio:latest
    container_name: substudio
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
